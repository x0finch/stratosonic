name: Deploy

# Deploys the production Worker from the cloud on every push to main, so the
# project never has to be built or deployed from a laptop. Cloudflare
# credentials live in the repository's Actions secrets, never in the repo:
#   - CLOUDFLARE_API_TOKEN   (an "Edit Cloudflare Workers" token)
#   - CLOUDFLARE_ACCOUNT_ID
# The Worker's own runtime secrets (INITIAL_PASSWORD, PASSWORD_ENCRYPTION_KEY)
# are set once on the Worker itself (dashboard or `wrangler secret put`) and are
# NOT touched here; `wrangler deploy` leaves them in place.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Never run two deploys at once; let an in-flight one finish rather than cancel.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Gate the deploy on the same checks a contributor runs, so a red main is
      # never shipped.
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      # Apply any new D1 migrations to the production database before deploying
      # the code that expects them. Wrangler runs non-interactively in CI, so it
      # applies without a confirmation prompt.
      - name: Apply D1 migrations (remote)
        working-directory: apps/server
        run: pnpm exec wrangler d1 migrations apply stratosonic --remote

      - name: Deploy Worker
        working-directory: apps/server
        run: pnpm exec wrangler deploy
